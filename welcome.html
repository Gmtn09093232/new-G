<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <title>Welcome to DOT BINGO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* same styles, no changes */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f3f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .welcome-card {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            padding: 36px 28px 32px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
            border: 1px solid rgba(0,0,0,0.04);
            text-align: center;
        }
        .welcome-card .icon { font-size: 4.5rem; margin-bottom: 6px; }
        .welcome-card h1 { font-size: 1.8rem; font-weight: 800; color: #1e293b; margin-bottom: 4px; }
        .welcome-card .sub { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
        .info-box {
            background: #f8fafc;
            border-radius: 28px;
            padding: 20px;
            margin: 16px 0 24px;
            border-left: 4px solid #f97316;
            text-align: left;
        }
        .info-box .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e9edf2;
        }
        .info-box .row:last-child { border-bottom: none; }
        .info-box .label { color: #64748b; font-weight: 500; font-size: 0.85rem; }
        .info-box .value { font-weight: 600; color: #1e293b; font-size: 0.95rem; }
        .info-box .value.admin { color: #f97316; }
        .btn-primary {
            display: inline-block;
            background: #f97316;
            color: white;
            font-weight: 700;
            padding: 14px 40px;
            border-radius: 60px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s ease;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
            text-decoration: none;
        }
        .btn-primary:active { transform: scale(0.96); }
        .btn-secondary {
            display: inline-block;
            background: #e2e8f0;
            color: #1e293b;
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            font-size: 0.9rem;
        }
        .loading { color: #94a3b8; font-size: 1rem; padding: 30px 0; }
        .hidden { display: none; }
        .telegram-links {
            margin-top: 24px;
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .telegram-links a { color: #f97316; text-decoration: none; font-weight: 600; }
        .badge {
            background: #fef3c7;
            color: #92400e;
            font-size: 0.7rem;
            padding: 2px 14px;
            border-radius: 30px;
            display: inline-block;
            font-weight: 600;
            margin-top: 8px;
        }
        .error-msg {
            background: #fee2e2;
            color: #991b1b;
            border-radius: 20px;
            padding: 12px 16px;
            margin: 16px 0;
            font-size: 0.9rem;
        }
        .retry-btn {
            background: #f97316;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="welcome-card" id="welcomeCard">
        <div class="icon">🎯</div>
        <h1>Welcome to <span style="color:#ea580c;">DOT BINGO</span></h1>
        <p class="sub">You’re now under an admin’s team!</p>

        <div id="loadingState" class="loading">
            <span>⏳ Loading your details…</span>
        </div>

        <div id="errorState" class="hidden">
            <div class="error-msg" id="errorMessage">Something went wrong.</div>
            <button class="retry-btn" id="retryBtn">🔄 Retry</button>
            <br>
            <button class="btn-secondary" id="goToGameBtnError">🎮 Go to Game</button>
        </div>

        <div id="infoState" class="hidden">
            <div class="info-box">
                <div class="row">
                    <span class="label">👤 Your Name</span>
                    <span class="value" id="playerName">—</span>
                </div>
                <div class="row">
                    <span class="label">💰 Your Balance</span>
                    <span class="value" id="playerBalance">—</span>
                </div>
                <div class="row">
                    <span class="label">👑 Your Admin</span>
                    <span class="value admin" id="adminName">—</span>
                </div>
            </div>

            <button class="btn-primary" id="goToGameBtn">🎮 Go to Game</button>
            <br>
            <button class="btn-secondary" id="depositBtn">💰 Deposit</button>
            <div class="badge">✅ Auto‑assigned via invite link</div>
        </div>

        <div class="telegram-links">
            📢 Join our community:<br>
            <a href="https://t.me/Dotbingogame" target="_blank">Dot Bingo help</a> |
            <a href="https://t.me/dotbingo" target="_blank">Dot Bingo channel</a>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const loadingEl = document.getElementById('loadingState');
        const errorEl = document.getElementById('errorState');
        const errorMsgEl = document.getElementById('errorMessage');
        const infoEl = document.getElementById('infoState');
        const playerNameEl = document.getElementById('playerName');
        const playerBalanceEl = document.getElementById('playerBalance');
        const adminNameEl = document.getElementById('adminName');

        // ===== Helper: fetch from /api/me =====
        async function fetchMe() {
            const response = await fetch('/api/me', {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include'
            });
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error || `HTTP ${response.status}`);
            }
            return await response.json();
        }

        // ===== Helper: authenticate via initData =====
        async function authenticate() {
            if (!tg.initData) {
                throw new Error('No Telegram initData available. Please open from the bot.');
            }
            const response = await fetch('/api/telegram-miniapp-auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ initData: tg.initData })
            });
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error || `HTTP ${response.status}`);
            }
            return await response.json();
        }

        // ===== Show error state =====
        function showError(message) {
            loadingEl.classList.add('hidden');
            errorEl.classList.remove('hidden');
            errorMsgEl.textContent = message || 'Failed to load. Please refresh.';
        }

        // ===== Main init =====
        async function init() {
            try {
                let userData = null;

                // First try to get from session
                try {
                    userData = await fetchMe();
                } catch (err) {
                    // If 401, try to authenticate
                    if (err.message.includes('Not logged in') || err.message.includes('401')) {
                        console.log('No session, authenticating...');
                        try {
                            await authenticate();
                            // Retry fetching user data
                            userData = await fetchMe();
                        } catch (authErr) {
                            console.error('Auth failed:', authErr);
                            // If auth fails, redirect to main page to login
                            window.location.href = '/';
                            return;
                        }
                    } else {
                        throw err;
                    }
                }

                // Success – display info
                loadingEl.classList.add('hidden');
                infoEl.classList.remove('hidden');

                playerNameEl.textContent = userData.username || 'Player';
                playerBalanceEl.textContent = userData.balance + ' ETB';
                const adminName = userData.assigned_admin_name || 'Not assigned yet';
                adminNameEl.textContent = adminName || '—';

                if (!adminName || adminName === 'Not assigned yet') {
                    adminNameEl.textContent = '⚠️ No admin assigned. Please deposit to pick one.';
                }
            } catch (err) {
                console.error('Error initializing welcome page:', err);
                showError('Failed to load. Please refresh.');
            }
        }

        // ===== Buttons =====
        document.getElementById('goToGameBtn').addEventListener('click', () => {
            window.location.href = '/';
        });
        document.getElementById('goToGameBtnError').addEventListener('click', () => {
            window.location.href = '/';
        });
        document.getElementById('depositBtn').addEventListener('click', () => {
            window.location.href = '/?action=deposit';
        });
        document.getElementById('retryBtn').addEventListener('click', () => {
            // Reset UI and retry
            errorEl.classList.add('hidden');
            loadingEl.classList.remove('hidden');
            loadingEl.textContent = '⏳ Retrying…';
            init();
        });

        // ===== Start =====
        init();
    </script>
</body>
</html>
