name = "new-g"
main = "index.js" # Replace with your actual server entry file name (e.g., src/index.js)
compatibility_date = "2026-10-06"
compatibility_flags = ["nodejs_compat"]

# If you have a frontend (like a build folder named 'dist' or 'public'), point to it here.
# If this is purely an API with no frontend, you can delete the [assets] section below.
[assets]
directory = "./public" 
binding = "ASSETS"
