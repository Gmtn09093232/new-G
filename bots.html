<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Bot Performance Stats</title>
<style>
:root {
    --bg-color:#0b0e14; --card-bg:#151a25; --card-bg-light:#1c2331;
    --text-primary:#ffffff; --text-secondary:#8b9bb4;
    --accent-gold:#f0b90b; --accent-blue:#2962ff;
    --accent-green:#0ecb81; --accent-red:#f6465d;
    --border-color:#262f40;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:Arial,Helvetica,sans-serif; background:var(--bg-color); color:var(--text-primary); display:flex; justify-content:center; padding:20px 0; min-height:100vh; }
.container { width:100%; max-width:480px; background:var(--bg-color); padding:0 16px 100px 16px; position:relative; }
.header { display:flex; align-items:center; justify-content:space-between; padding:20px 0; margin-bottom:10px; }
.header-title { display:flex; align-items:center; gap:12px; font-size:1.3rem; font-weight:bold; }
.header-actions { display:flex; gap:12px; color:var(--text-secondary); font-size:.85rem; cursor:pointer; }
.header-actions span:hover { color:var(--text-primary); }
.message { padding:12px; margin-bottom:16px; display:none; font-size:.9rem; border:1px solid; }
.message.success { background:var(--card-bg); color:var(--accent-green); border-color:var(--accent-green); display:block; }
.message.error   { background:var(--card-bg); color:var(--accent-red); border-color:var(--accent-red); display:block; }
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
.stat-card { background:var(--card-bg); border:1px solid var(--border-color); padding:16px; display:flex; flex-direction:column; gap:8px; }
.stat-header { display:flex; align-items:center; gap:8px; color:var(--text-secondary); font-size:.85rem; }
.stat-value { font-size:1.4rem; font-weight:bold; color:var(--accent-gold); }
.stat-subtext { font-size:.75rem; color:var(--text-secondary); }
.stat-card.positive .stat-value { color:var(--accent-green); }
.stat-card.negative .stat-value { color:var(--accent-red); }
.section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.section-header h3 { font-size:1.1rem; font-weight:bold; }
.sort-label { font-size:.8rem; color:var(--text-secondary); }
.bot-list { display:flex; flex-direction:column; gap:12px; margin-bottom:24px; }
.bot-card { background:var(--card-bg); border:1px solid var(--border-color); padding:16px; display:flex; flex-direction:column; gap:12px; }
.bot-card-header { display:flex; justify-content:space-between; align-items:flex-start; }
.bot-id { display:flex; align-items:center; gap:8px; font-weight:bold; font-size:.95rem; }
.bot-stats-row { display:flex; justify-content:space-between; font-size:.8rem; color:var(--text-secondary); margin-top:4px; }
.bot-stats-row span { display:flex; flex-direction:column; gap:2px; }
.bot-stats-row strong { color:var(--text-primary); font-size:.95rem; font-weight:bold; }
.bot-stats-row strong.positive { color:var(--accent-green); }
.bot-stats-row strong.negative { color:var(--accent-red); }
.bot-actions { display:flex; gap:8px; }
.bot-actions button { flex:1; padding:8px; border:1px solid var(--border-color); font-size:.8rem; font-weight:bold; cursor:pointer; }
.btn-set   { background:#1c2331; color:#5b9bf5; }
.btn-zero  { background:#1c2331; color:var(--text-secondary); }
.btn-force { background:#1c2331; color:var(--accent-green); }
.btn-force:disabled { opacity:.4; cursor:not-allowed; }
.recent-games-list { display:flex; flex-direction:column; gap:8px; }
.game-item { background:var(--card-bg); border:1px solid var(--border-color); padding:16px; display:flex; align-items:center; gap:16px; }
.game-icon { width:40px; height:40px; background:var(--accent-blue); display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:1.2rem; color:#fff; flex-shrink:0; }
.game-info { flex:1; display:flex; flex-direction:column; gap:4px; }
.game-title { font-weight:bold; font-size:.95rem; }
.game-meta { font-size:.75rem; color:var(--text-secondary); }
.game-prize { display:flex; flex-direction:column; align-items:flex-end; color:var(--accent-gold); }
.game-prize span { font-weight:bold; font-size:1rem; }
.game-prize small { font-size:.7rem; color:var(--text-secondary); }
.bottom-actions { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--bg-color); padding:16px; display:flex; gap:12px; border-top:1px solid var(--border-color); z-index:100; }
.bottom-actions button { flex:1; padding:14px; border:1px solid var(--border-color); font-size:.95rem; font-weight:bold; cursor:pointer; }
.btn-reset-all { background:var(--accent-gold); color:#000; }
.btn-zero-all  { background:var(--accent-red); color:#fff; }
.filter-panel { display:none; background:var(--card-bg); padding:16px; margin-bottom:16px; gap:10px; flex-direction:column; border:1px solid var(--border-color); }
.filter-panel.active { display:flex; }
.filter-panel input { padding:10px; border:1px solid var(--border-color); background:var(--bg-color); color:#fff; width:100%; }
.filter-panel button { padding:10px; border:1px solid var(--accent-blue); background:var(--accent-blue); color:#fff; font-weight:bold; cursor:pointer; }
.filter-panel label { font-size:.8rem; color:var(--text-secondary); }
.loading, .no-data { text-align:center; color:var(--text-secondary); padding:20px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-title">Bot Stats</div>
    <div class="header-actions">
      <span onclick="document.getElementById('filterPanel').classList.toggle('active')">Filter</span>
      <span onclick="fetchStats()">Refresh</span>
    </div>
  </div>

  <div class="filter-panel" id="filterPanel">
    <label>From Date</label>
    <input type="date" id="fromDate">
    <label>To Date</label>
    <input type="date" id="toDate">
    <button onclick="fetchStats()">Apply Filter</button>
  </div>

  <div id="message" class="message"></div>

  <div class="stats-grid" id="summaryStats">
    <div class="stat-card">
      <div class="stat-header">Total Games</div>
      <div class="stat-value" id="totalGames">-</div>
      <div class="stat-subtext">All bots combined</div>
    </div>
    <div class="stat-card">
      <div class="stat-header">Total Winnings</div>
      <div class="stat-value" id="totalWinnings">-</div>
      <div class="stat-subtext">All bots combined</div>
    </div>
    <div class="stat-card">
      <div class="stat-header">Entry Fees</div>
      <div class="stat-value" id="totalEntryFees">-</div>
      <div class="stat-subtext">All bots combined</div>
    </div>
    <div class="stat-card" id="differenceBox">
      <div class="stat-header">Difference</div>
      <div class="stat-value" id="difference">-</div>
      <div class="stat-subtext" id="differencePercent">Profit</div>
    </div>
  </div>

  <div class="section-header">
    <h3>Bot Performance</h3>
    <div class="sort-label">Sort: Bot ID</div>
  </div>
  <div class="bot-list" id="perBotList">
    <div class="loading">Loading...</div>
  </div>

  <div class="section-header" style="margin-top:24px;">
    <h3>Recent Games (last 10)</h3>
  </div>
  <div class="recent-games-list" id="recentGamesList"></div>
</div>

<div class="bottom-actions">
  <button class="btn-reset-all" onclick="resetAllBalances()">Reset All</button>
  <button class="btn-zero-all" onclick="zeroAllBalances()">Zero All</button>
</div>

<script>
// ✅ Read secret from URL instead of prompt()
const ADMIN_SECRET = new URLSearchParams(location.search).get('secret') || '';
if (!ADMIN_SECRET) {
  document.body.innerHTML =
    '<div style="padding:24px;font-family:Arial;color:#f87171;text-align:center">' +
    '<b>Access denied</b><br><span style="color:#94a3b8;font-size:.9rem">' +
    'Missing secret. Use /bots?secret=YOUR_SECRET</span></div>';
  throw new Error('No secret');
}

function showMessage(text, type = 'success') {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = 'message ' + type;
  setTimeout(() => { msg.className = 'message'; }, 5000);
}
async function fetchJSON(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  if (!data.success) throw new Error(data.error || 'Request failed');
  return data;
}
async function fetchStats() {
  const from = document.getElementById('fromDate').value;
  const to = document.getElementById('toDate').value;
  let historyUrl = `/admin/bot-history?secret=${encodeURIComponent(ADMIN_SECRET)}`;
  if (from) historyUrl += `&from=${from}`;
  if (to) historyUrl += `&to=${to}`;
  try {
    const [historyData, statusData] = await Promise.all([
      fetchJSON(historyUrl),
      fetchJSON(`/admin/bots-status?secret=${encodeURIComponent(ADMIN_SECRET)}`)
    ]);
    renderStats(historyData.history, statusData.bots);
  } catch (err) {
    showMessage('Error loading data: ' + err.message, 'error');
  }
}
async function resetBalance(botId, newBalance) {
  if (isNaN(newBalance) || newBalance < 0) { showMessage('Invalid balance amount', 'error'); return; }
  try {
    const resp = await fetch('/admin/bot-reset-balance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: ADMIN_SECRET, botId, newBalance })
    });
    const data = await resp.json();
    if (!data.success) throw new Error(data.error || 'Failed');
    showMessage(`Balance for ${botId} set to ${newBalance} ETB`, 'success');
    fetchStats();
  } catch (err) { showMessage('Error: ' + err.message, 'error'); }
}
async function resetAllBalances() {
  if (!confirm('Reset all bot balances to 1000 ETB?')) return;
  try {
    const statusData = await fetchJSON(`/admin/bots-status?secret=${encodeURIComponent(ADMIN_SECRET)}`);
    const bots = statusData.bots;
    for (const bot of bots) await resetBalance(bot.id, 1000);
    showMessage('All balances reset to 1000 ETB', 'success');
    fetchStats();
  } catch (err) { showMessage('Error resetting balances: ' + err.message, 'error'); }
}
async function zeroAllBalances() {
  if (!confirm('Set ALL bot balances to 0 ETB?\n\nThis will STOP all bots from playing until you reset their balance again.')) return;
  try {
    const statusData = await fetchJSON(`/admin/bots-status?secret=${encodeURIComponent(ADMIN_SECRET)}`);
    const bots = statusData.bots;
    let failed = 0;
    for (const bot of bots) {
      try {
        const resp = await fetch('/admin/bot-reset-balance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret: ADMIN_SECRET, botId: bot.id, newBalance: 0 })
        });
        const data = await resp.json();
        if (!data.success) failed++;
      } catch { failed++; }
    }
    if (failed === 0) showMessage(`All ${bots.length} bot balances set to 0 — bots stopped.`, 'success');
    else showMessage(`Done with ${failed} failure(s). Check console.`, 'error');
    fetchStats();
  } catch (err) { showMessage('Error zeroing balances: ' + err.message, 'error'); }
}
async function forceWin(botId) {
  if (!confirm(`Force bot ${botId} to win the current game?`)) return;
  try {
    const resp = await fetch('/admin/bot-force-win', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: ADMIN_SECRET, botId })
    });
    const data = await resp.json();
    if (!data.success) throw new Error(data.error || 'Failed');
    showMessage(`${botId} forced to win! Game ending.`, 'success');
    setTimeout(() => fetchStats(), 3000);
  } catch (err) { showMessage('Error: ' + err.message, 'error'); }
}
function renderStats(history, bots) {
  const totalGames = history.length;
  const totalWinnings = history.reduce((sum, e) => sum + e.prizeWon, 0);
  const totalEntryFees = totalGames * 20;
  const difference = totalWinnings - totalEntryFees;
  document.getElementById('totalGames').textContent = totalGames.toLocaleString();
  document.getElementById('totalWinnings').textContent = totalWinnings.toFixed(2) + ' ETB';
  document.getElementById('totalEntryFees').textContent = totalEntryFees.toFixed(2) + ' ETB';
  document.getElementById('difference').textContent = difference.toFixed(2) + ' ETB';
  const box = document.getElementById('differenceBox');
  box.className = 'stat-card ' + (difference >= 0 ? 'positive' : 'negative');
  const diffPercent = totalEntryFees > 0 ? ((difference / totalEntryFees) * 100).toFixed(2) : 0;
  const percentEl = document.getElementById('differencePercent');
  if (difference >= 0) { percentEl.textContent = `Profit (+${diffPercent}%)`; percentEl.style.color = 'var(--accent-green)'; }
  else { percentEl.textContent = `Loss (${diffPercent}%)`; percentEl.style.color = 'var(--accent-red)'; }

  const perBot = {};
  for (const entry of history) {
    if (!perBot[entry.botId]) perBot[entry.botId] = { games: 0, winnings: 0 };
    perBot[entry.botId].games++;
    perBot[entry.botId].winnings += entry.prizeWon;
  }
  for (const bot of bots) {
    if (!perBot[bot.id]) perBot[bot.id] = { games: 0, winnings: 0 };
    perBot[bot.id].balance = bot.balance;
    perBot[bot.id].inGame = bot.inGame;
  }
  const botListContainer = document.getElementById('perBotList');
  botListContainer.innerHTML = '';
  for (const [botId, stats] of Object.entries(perBot)) {
    const inGame = stats.inGame || false;
    const balance = stats.balance || 0;
    const balanceClass = balance >= 0 ? 'positive' : 'negative';
    const card = document.createElement('div');
    card.className = 'bot-card';
    card.innerHTML = `
      <div class="bot-card-header"><div class="bot-id">${botId}</div></div>
      <div class="bot-stats-row">
        <span>Games played <strong>${stats.games}</strong></span>
        <span>Winnings <strong>${stats.winnings.toFixed(2)} ETB</strong></span>
        <span>Balance <strong class="${balanceClass}">${balance >= 0 ? '+' : ''}${balance.toFixed(2)} ETB</strong></span>
      </div>
      <div class="bot-actions">
        <button class="btn-set" onclick="promptSetBalance('${botId}', ${balance})">Set</button>
        <button class="btn-zero" onclick="resetBalance('${botId}', 0)">Zero</button>
        <button class="btn-force" ${inGame ? '' : 'disabled'} onclick="forceWin('${botId}')">${inGame ? 'Force Win' : 'Not in Game'}</button>
      </div>`;
    botListContainer.appendChild(card);
  }
  const recentContainer = document.getElementById('recentGamesList');
  if (history.length === 0) recentContainer.innerHTML = '<div class="no-data">No games played.</div>';
  else {
    const recent = history.slice(-10).reverse();
    recentContainer.innerHTML = recent.map(e => `
      <div class="game-item">
        <div class="game-icon">#</div>
        <div class="game-info">
          <div class="game-title">Game #${e.gameNumber}</div>
          <div class="game-meta">${e.botId}</div>
          <div class="game-meta">${new Date(e.date).toLocaleString()}</div>
        </div>
        <div class="game-prize"><span>${e.prizeWon}</span><small>Gold</small></div>
      </div>`).join('');
  }
}
function promptSetBalance(botId, currentBalance) {
  const newBalance = prompt(`Enter new balance for ${botId}:`, currentBalance);
  if (newBalance !== null) resetBalance(botId, parseFloat(newBalance));
}
const today = new Date().toISOString().split('T')[0];
document.getElementById('fromDate').value = today;
document.getElementById('toDate').value = today;
fetchStats();
</script>
</body>
</html>
