<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Performance Stats</title>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a25;
      --card-bg-light: #1c2331;
      --text-primary: #ffffff;
      --text-secondary: #8b9bb4;
      --accent-gold: #f0b90b;
      --accent-blue: #2962ff;
      --accent-green: #0ecb81;
      --accent-red: #f6465d;
      --border-color: #262f40;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      padding: 20px 0;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px; /* Mobile app width */
      background: var(--bg-color);
      padding: 0 16px 100px 16px;
      position: relative;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      margin-bottom: 10px;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .header-title i { color: var(--accent-gold); font-size: 1.8rem; }
    .header-actions { display: flex; gap: 16px; color: var(--text-secondary); font-size: 1.2rem; cursor: pointer; }
    .header-actions i:hover { color: var(--text-primary); }

    /* Message */
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      font-size: 0.9rem;
    }
    .message.success { background: rgba(14, 203, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); display: block; }
    .message.error { background: rgba(246, 70, 93, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); display: block; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stat-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    .stat-header i { font-size: 1.1rem; }
    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-gold);
    }
    .stat-subtext {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .stat-card.positive .stat-value { color: var(--accent-green); }
    .stat-card.negative .stat-value { color: var(--accent-red); }

    /* Section Headers */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .section-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header h3 i { color: var(--accent-gold); }
    .sort-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Bot Cards */
    .bot-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .bot-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bot-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .bot-id {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .bot-id i { color: var(--accent-gold); }
    .bot-stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .bot-stats-row span { display: flex; flex-direction: column; gap: 2px; }
    .bot-stats-row strong { color: var(--text-primary); font-size: 0.95rem; font-weight: 600; }
    .bot-stats-row strong.positive { color: var(--accent-green); }
    .bot-stats-row strong.negative { color: var(--accent-red); }

    .bot-actions { display: flex; gap: 8px; }
    .bot-actions button {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .bot-actions button:hover { opacity: 0.8; }
    .btn-set { background: #1c2331; color: #5b9bf5; border: 1px solid #2a3a5e; }
    .btn-zero { background: #1c2331; color: var(--text-secondary); border: 1px solid #2a3a5e; }
    .btn-force { background: rgba(14, 203, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(14, 203, 129, 0.3); }
    .btn-force:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Recent Games List */
    .recent-games-list { display: flex; flex-direction: column; gap: 8px; }
    .game-item {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .game-icon {
      width: 40px;
      height: 40px;
      background: var(--accent-blue);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      color: #fff;
      flex-shrink: 0;
    }
    .game-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .game-title { font-weight: 600; font-size: 0.95rem; }
    .game-meta { font-size: 0.75rem; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .game-prize {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      color: var(--accent-gold);
    }
    .game-prize i { font-size: 1.2rem; margin-bottom: 2px; }
    .game-prize span { font-weight: 700; font-size: 1rem; }
    .game-prize small { font-size: 0.7rem; color: var(--text-secondary); }

    /* Bottom Sticky Actions */
    .bottom-actions {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--bg-color);
      padding: 16px;
      display: flex;
      gap: 12px;
      border-top: 1px solid var(--border-color);
      z-index: 100;
    }
    .bottom-actions button {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-reset-all { background: var(--accent-gold); color: #000; }
    .btn-zero-all { background: var(--accent-red); color: #fff; }

    /* Filter Form (Hidden by default, triggered by icon) */
    .filter-panel {
      display: none;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      gap: 10px;
      flex-direction: column;
    }
    .filter-panel.active { display: flex; }
    .filter-panel input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: #fff;
      width: 100%;
    }
    .filter-panel button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: var(--accent-blue);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .loading { text-align: center; color: var(--text-secondary); padding: 20px; }
    .no-data { text-align: center; color: var(--text-secondary); padding: 20px; }
  </style>
</head>
<body>
<div class="container">
  
  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <i class="fa-solid fa-robot"></i>
      Bot Stats
    </div>
    <div class="header-actions">
      <i class="fa-solid fa-filter" onclick="document.getElementById('filterPanel').classList.toggle('active')"></i>
      <i class="fa-solid fa-rotate-right" onclick="fetchStats()"></i>
    </div>
  </div>

  <!-- Filter Panel -->
  <div class="filter-panel" id="filterPanel">
    <label style="font-size: 0.8rem; color: var(--text-secondary);">From Date</label>
    <input type="date" id="fromDate">
    <label style="font-size: 0.8rem; color: var(--text-secondary);">To Date</label>
    <input type="date" id="toDate">
    <button onclick="fetchStats()">Apply Filter</button>
  </div>

  <div id="message" class="message"></div>

  <!-- Stats Summary -->
  <div class="stats-grid" id="summaryStats">
    <div class="stat-card">
      <div class="stat-header"><i class="fa-solid fa-gamepad"></i> Total Games</div>
      <div class="stat-value" id="totalGames">-</div>
      <div class="stat-subtext">All bots combined</div>
    </div>
    <div class="stat-card">
      <div class="stat-header"><i class="fa-solid fa-trophy"></i> Total Winnings</div>
      <div class="stat-value" id="totalWinnings">-</div>
      <div class="stat-subtext">All bots combined</div>
    </div>
    <div class="stat-card">
      <div class="stat-header"><i class="fa-solid fa-coins"></i> Entry Fees</div>
      <div class="stat-value" id="totalEntryFees">-</div>
      <div class="stat-subtext">All bots combined</div>
    </div>
    <div class="stat-card" id="differenceBox">
      <div class="stat-header"><i class="fa-solid fa-chart-line"></i> Difference</div>
      <div class="stat-value" id="difference">-</div>
      <div class="stat-subtext" id="differencePercent">Profit</div>
    </div>
  </div>

  <!-- Bot Performance -->
  <div class="section-header">
    <h3><i class="fa-solid fa-robot"></i> Bot Performance</h3>
    <div class="sort-label"><i class="fa-solid fa-arrow-up-wide-short"></i> Sort: Bot ID</div>
  </div>
  <div class="bot-list" id="perBotList">
    <div class="loading">Loading...</div>
  </div>

  <!-- Recent Games -->
  <div class="section-header" style="margin-top: 24px;">
    <h3>Recent Games (last 10)</h3>
  </div>
  <div class="recent-games-list" id="recentGamesList">
    <!-- Populated by JS -->
  </div>

</div>

<!-- Bottom Sticky Actions -->
<div class="bottom-actions">
  <button class="btn-reset-all" onclick="resetAllBalances()"><i class="fa-solid fa-rotate-left"></i> Reset All</button>
  <button class="btn-zero-all" onclick="zeroAllBalances()"><i class="fa-solid fa-xmark"></i> Zero All</button>
</div>

<script>
  const ADMIN_SECRET = prompt('Enter admin secret:') || '';

  function showMessage(text, type = 'success') {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = 'message ' + type;
    setTimeout(() => { msg.className = 'message'; }, 5000);
  }

  async function fetchJSON(url) {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    if (!data.success) throw new Error(data.error || 'Request failed');
    return data;
  }

  async function fetchStats() {
    const from = document.getElementById('fromDate').value;
    const to = document.getElementById('toDate').value;
    let historyUrl = `/admin/bot-history?secret=${encodeURIComponent(ADMIN_SECRET)}`;
    if (from) historyUrl += `&from=${from}`;
    if (to) historyUrl += `&to=${to}`;

    try {
      const [historyData, statusData] = await Promise.all([
        fetchJSON(historyUrl),
        fetchJSON(`/admin/bots-status?secret=${encodeURIComponent(ADMIN_SECRET)}`)
      ]);
      renderStats(historyData.history, statusData.bots);
    } catch (err) {
      showMessage('Error loading data: ' + err.message, 'error');
    }
  }

  async function resetBalance(botId, newBalance) {
    if (isNaN(newBalance) || newBalance < 0) {
      showMessage('Invalid balance amount', 'error');
      return;
    }
    try {
      const resp = await fetch('/admin/bot-reset-balance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: ADMIN_SECRET, botId, newBalance })
      });
      const data = await resp.json();
      if (!data.success) throw new Error(data.error || 'Failed');
      showMessage(`✅ Balance for ${botId} set to ${newBalance} ETB`, 'success');
      fetchStats(); 
    } catch (err) {
      showMessage('Error: ' + err.message, 'error');
    }
  }

  async function resetAllBalances() {
    if (!confirm('Reset all bot balances to 1000 ETB?')) return;
    try {
      const statusData = await fetchJSON(`/admin/bots-status?secret=${encodeURIComponent(ADMIN_SECRET)}`);
      const bots = statusData.bots;
      for (const bot of bots) {
        await resetBalance(bot.id, 1000);
      }
      showMessage('✅ All balances reset to 1000 ETB', 'success');
      fetchStats();
    } catch (err) {
      showMessage('Error resetting balances: ' + err.message, 'error');
    }
  }

  async function zeroAllBalances() {
    if (!confirm('Set ALL bot balances to 0 ETB?\n\nThis will STOP all bots from playing until you reset their balance again.')) return;
    try {
      const statusData = await fetchJSON(`/admin/bots-status?secret=${encodeURIComponent(ADMIN_SECRET)}`);
      const bots = statusData.bots;
      let failed = 0;
      for (const bot of bots) {
        try {
          const resp = await fetch('/admin/bot-reset-balance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ secret: ADMIN_SECRET, botId: bot.id, newBalance: 0 })
          });
          const data = await resp.json();
          if (!data.success) failed++;
        } catch (e) {
          failed++;
        }
      }
      if (failed === 0) {
        showMessage(`⛔ All ${bots.length} bot balances set to 0 — bots stopped.`, 'success');
      } else {
        showMessage(`⚠️ Done with ${failed} failure(s). Check console.`, 'error');
      }
      fetchStats();
    } catch (err) {
      showMessage('Error zeroing balances: ' + err.message, 'error');
    }
  }

  async function forceWin(botId) {
    if (!confirm(`Force bot ${botId} to win the current game?`)) return;
    try {
      const resp = await fetch('/admin/bot-force-win', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: ADMIN_SECRET, botId })
      });
      const data = await resp.json();
      if (!data.success) throw new Error(data.error || 'Failed');
      showMessage(`✅ ${botId} forced to win! Game ending.`, 'success');
      setTimeout(() => fetchStats(), 3000);
    } catch (err) {
      showMessage('Error: ' + err.message, 'error');
    }
  }

  function renderStats(history, bots) {
    // Summary Stats
    const totalGames = history.length;
    const totalWinnings = history.reduce((sum, e) => sum + e.prizeWon, 0);
    const totalEntryFees = totalGames * 20;
    const difference = totalWinnings - totalEntryFees;
    const totalBalance = bots.reduce((sum, b) => sum + b.balance, 0);

    document.getElementById('totalGames').textContent = totalGames.toLocaleString();
    document.getElementById('totalWinnings').textContent = totalWinnings.toFixed(2) + ' ETB';
    document.getElementById('totalEntryFees').textContent = totalEntryFees.toFixed(2) + ' ETB';
    
    const diffEl = document.getElementById('difference');
    diffEl.textContent = difference.toFixed(2) + ' ETB';
    
    const box = document.getElementById('differenceBox');
    box.className = 'stat-card ' + (difference >= 0 ? 'positive' : 'negative');
    
    const diffPercent = totalEntryFees > 0 ? ((difference / totalEntryFees) * 100).toFixed(2) : 0;
    const percentEl = document.getElementById('differencePercent');
    if (difference >= 0) {
      percentEl.textContent = `Profit (+${diffPercent}%)`;
      percentEl.style.color = 'var(--accent-green)';
    } else {
      percentEl.textContent = `Loss (${diffPercent}%)`;
      percentEl.style.color = 'var(--accent-red)';
    }

    // Per Bot Breakdown
    const perBot = {};
    for (const entry of history) {
      if (!perBot[entry.botId]) perBot[entry.botId] = { games: 0, winnings: 0 };
      perBot[entry.botId].games++;
      perBot[entry.botId].winnings += entry.prizeWon;
    }
    for (const bot of bots) {
      if (!perBot[bot.id]) perBot[bot.id] = { games: 0, winnings: 0 };
      perBot[bot.id].balance = bot.balance;
      perBot[bot.id].inGame = bot.inGame;
    }

    const botListContainer = document.getElementById('perBotList');
    botListContainer.innerHTML = '';
    
    for (const [botId, stats] of Object.entries(perBot)) {
      const inGame = stats.inGame || false;
      const balance = stats.balance || 0;
      const balanceClass = balance >= 0 ? 'positive' : 'negative';
      
      const card = document.createElement('div');
      card.className = 'bot-card';
      card.innerHTML = `
        <div class="bot-card-header">
          <div class="bot-id"><i class="fa-solid fa-robot"></i> ${botId}</div>
        </div>
        <div class="bot-stats-row">
          <span>Games played <strong>${stats.games}</strong></span>
          <span>Winnings <strong>${stats.winnings.toFixed(2)} ETB</strong></span>
          <span>Balance <strong class="${balanceClass}">${balance >= 0 ? '+' : ''}${balance.toFixed(2)} ETB</strong></span>
        </div>
        <div class="bot-actions">
          <button class="btn-set" onclick="promptSetBalance('${botId}', ${balance})">
            <i class="fa-solid fa-gear"></i> Set
          </button>
          <button class="btn-zero" onclick="resetBalance('${botId}', 0)">
            <i class="fa-solid fa-circle-xmark"></i> Zero
          </button>
          <button class="btn-force" ${inGame ? '' : 'disabled'} onclick="forceWin('${botId}')">
            <i class="fa-solid fa-trophy"></i> ${inGame ? 'Force Win' : 'Not in Game'}
          </button>
        </div>
      `;
      botListContainer.appendChild(card);
    }

    // Recent Games List
    const recentContainer = document.getElementById('recentGamesList');
    if (history.length === 0) {
      recentContainer.innerHTML = '<div class="no-data">No games played.</div>';
    } else {
      const recent = history.slice(-10).reverse();
      recentContainer.innerHTML = recent.map(e => `
        <div class="game-item">
          <div class="game-icon">#</div>
          <div class="game-info">
            <div class="game-title">Game #${e.gameNumber}</div>
            <div class="game-meta"><i class="fa-solid fa-robot"></i> ${e.botId}</div>
            <div class="game-meta"><i class="fa-solid fa-calendar"></i> ${new Date(e.date).toLocaleString()}</div>
          </div>
          <div class="game-prize">
            <i class="fa-solid fa-trophy"></i>
            <span>${e.prizeWon}</span>
            <small>Gold</small>
          </div>
        </div>
      `).join('');
    }
  }

  // Helper for Set button to use native prompt instead of input field in the card
  function promptSetBalance(botId, currentBalance) {
    const newBalance = prompt(`Enter new balance for ${botId}:`, currentBalance);
    if (newBalance !== null) {
      resetBalance(botId, parseFloat(newBalance));
    }
  }

  // Set default dates: today
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('fromDate').value = today;
  document.getElementById('toDate').value = today;
  
  // Initial fetch
  fetchStats();
</script>
</body>
</html>
