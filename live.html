<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1017">
<title>Telegram Bingo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0b1017;color:#f8fafc;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:430px;background:#111827;display:flex;flex-direction:column;min-height:100vh}
header{padding:16px 16px 10px}
h1{font-size:1.05rem;font-weight:800;letter-spacing:-.2px}
header p{font-size:.72rem;color:#94a3b8;font-weight:500}
.tabs{display:flex;gap:4px;background:#1e293b;margin:0 16px 16px;padding:4px;border-radius:12px}
.tabs button{flex:1;padding:9px 0;border:0;background:none;color:#94a3b8;font:600 .78rem system-ui,sans-serif;border-radius:9px;cursor:pointer}
.tabs button.on{background:rgba(59,130,246,.16);color:#60a5fa}
main{flex:1;padding:0 16px 92px}
.view{display:none}
.view.on{display:block}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
.head h2{font-size:1.2rem;font-weight:800;letter-spacing:-.3px}
.mut{font-size:.72rem;color:#94a3b8;font-weight:600}
.tag{display:inline-block;margin-top:5px;background:rgba(34,197,94,.15);color:#4ade80;font-size:.62rem;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
ul{list-style:none}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1e293b;cursor:pointer}
.row:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem;flex:none}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.info b{font-size:.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info small{font-size:.72rem;color:#94a3b8}
.badge{flex:none;background:rgba(59,130,246,.15);color:#60a5fa;font-size:.74rem;font-weight:700;padding:5px 10px;border-radius:10px}
.badge.g{background:rgba(34,197,94,.15);color:#4ade80}
.badge.z{background:rgba(148,163,184,.12);color:#94a3b8}
.empty{padding:34px 0;text-align:center;color:#64748b;font-size:.82rem}
.card{background:#1f2937;border:1px solid #1e293b;border-radius:16px;padding:18px;margin-bottom:18px}
.card .v{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.5px;margin:2px 0}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.prof .av{width:56px;height:56px;font-size:1.3rem}
.dl div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #1e293b}
.dl div:last-child{border-bottom:0}
.dl span{font-size:.75rem;color:#94a3b8}
.dl b{font-size:.9rem;font-weight:700;text-align:right;word-break:break-word}
.back{background:none;border:0;color:#94a3b8;font:600 .85rem system-ui,sans-serif;padding:4px 0;margin-bottom:10px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:430px;background:#111827;border-top:1px solid #1e293b;display:flex;padding:8px 8px 14px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:#94a3b8;font:600 .68rem system-ui,sans-serif;padding:6px 0;border-radius:12px;cursor:pointer}
nav button.on{background:rgba(59,130,246,.15);color:#3b82f6}
nav i{font-style:normal;font-size:1.15rem;line-height:1}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <h1>Telegram Bingo</h1>
    <p>Play. Win. Together.</p>
  </header>

  <div class="tabs" id="tabs">
    <button class="on" data-stake="10">10 ETB</button>
    <button data-stake="20">20 ETB</button>
    <button data-stake="30">30 ETB</button>
  </div>

  <main>
    <!-- LIVE -->
    <section id="live" class="view on">
      <div class="head">
        <div>
          <h2 id="room">10 ETB Room</h2>
          <span class="tag" id="st">Running</span>
        </div>
        <span class="mut" id="count">0 players</span>
      </div>
      <ul id="liveList"></ul>
    </section>

    <!-- REGISTERED -->
    <section id="users" class="view">
      <div class="head">
        <h2>Registered Users</h2>
        <span class="mut" id="uCount">0 users</span>
      </div>
      <ul id="uList"></ul>
    </section>

    <!-- BALANCES -->
    <section id="bal" class="view">
      <div class="card">
        <span class="mut">Total balance</span>
        <span class="v" id="tBal">0 ETB</span>
        <small class="mut" id="tCount">0 registered</small>
      </div>
      <ul id="bList"></ul>
    </section>

    <!-- DETAILS -->
    <section id="details" class="view">
      <button class="back" id="back">&larr; Back</button>
      <div class="prof">
        <span class="av" id="d-av">?</span>
        <div class="info">
          <b id="d-name"></b>
          <small id="d-handle"></small>
        </div>
      </div>
      <div class="dl">
        <div><span>Telegram ID</span><b id="d-id"></b></div>
        <div><span>Username</span><b id="d-user"></b></div>
        <div><span>Stake</span><b id="d-stake"></b></div>
        <div><span>Card</span><b id="d-card"></b></div>
        <div><span>Balance</span><b id="d-bal"></b></div>
      </div>
    </section>
  </main>

  <nav id="nav">
    <button class="on" data-view="live"><i>&#127968;</i>Live</button>
    <button data-view="users"><i>&#128101;</i>Players</button>
    <button data-view="bal"><i>&#128176;</i>Balances</button>
  </nav>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  var secret = new URLSearchParams(location.search).get('secret');
  if (!secret) {
    document.body.innerHTML =
      '<div style="padding:24px;font-family:system-ui;color:#f87171;text-align:center">' +
      '<b>Access denied</b><br><span style="color:#94a3b8;font-size:.9rem">' +
      'Missing secret. Use /live?secret=YOUR_SECRET</span></div>';
    return;
  }

  /* ---------- state ---------- */
  var stake = 10;
  var live = [];      // players in rooms
  var users = [];     // all registered users
  var status = {};    // gameStatus map
  var lastMain = 'live';
  var SRC = { live: [], reg: [], bal: [] };  // index lookup for clicks

  var COLORS = [
    ['#1e3a8a', '#bfdbfe'], ['#134e4a', '#99f6e4'], ['#7c2d12', '#fdba74'],
    ['#4c1d95', '#ddd6fe'], ['#713f12', '#fef08a'], ['#831843', '#fbcfe8']
  ];

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function colorFor(s) {
    var h = 0, i;
    for (i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
    return COLORS[Math.abs(h) % COLORS.length];
  }
  function handle(p) {
    return p.telegram_handle ? '@' + p.telegram_handle : (p.username || 'Anonymous');
  }
  function cardOf(p) {
    if (p.cardNumber != null) return p.cardNumber;
    if (p.card != null) return p.card;
    return 'N/A';
  }
  function initialOf(h) {
    return (h.charAt(0) === '@' ? h.charAt(1) : h.charAt(0) || '?').toUpperCase();
  }
  function num(n) { return Number(n || 0); }

  function rowHtml(p, badge, cls, i, src) {
    var h = handle(p);
    var c = colorFor(h);
    return '<li class="row" data-src="' + src + '" data-i="' + i + '">' +
      '<span class="av" style="background:' + c[0] + ';color:' + c[1] + '">' + esc(initialOf(h)) + '</span>' +
      '<span class="info"><b>' + esc(h) + '</b><small>' + esc(p.telegramId || '') + '</small></span>' +
      '<span class="badge ' + (cls || '') + '">' + esc(badge) + '</span></li>';
  }

  /* ---------- views ---------- */
  function show(v) {
    var views = document.querySelectorAll('.view'), i;
    for (i = 0; i < views.length; i++) views[i].classList.toggle('on', views[i].id === v);

    var isDetails = (v === 'details');
    $('hdr').classList.toggle('hide', isDetails);
    $('tabs').classList.toggle('hide', isDetails);

    var btns = $('nav').children;
    for (i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].dataset.view === v);

    if (!isDetails) lastMain = v;
    window.scrollTo(0, 0);
  }

  /* ---------- render ---------- */
  function renderLive() {
    var list = live.filter(function (p) { return String(p.stake) === String(stake); });
    SRC.live = list;
    $('count').textContent = list.length + ' players';

    var st = status[stake] || status[String(stake)];
    $('st').textContent = st ? String(st).toUpperCase() : 'RUNNING';

    if (!list.length) {
      $('liveList').innerHTML = '<li class="empty">No players in ' + stake + ' ETB stake</li>';
      return;
    }
    var html = '', i;
    for (i = 0; i < list.length; i++) {
      html += rowHtml(list[i], '#' + cardOf(list[i]), '', i, 'live');
    }
    $('liveList').innerHTML = html;
  }

  function renderUsers() {
    SRC.reg = users;
    $('uCount').textContent = users.length + ' users';
    if (!users.length) {
      $('uList').innerHTML = '<li class="empty">No registered users found.</li>';
      return;
    }
    var html = '', i;
    for (i = 0; i < users.length; i++) {
      html += rowHtml(users[i], num(users[i].balance).toLocaleString() + ' ETB', '', i, 'reg');
    }
    $('uList').innerHTML = html;
  }

  function renderBal() {
    var sorted = users.slice().sort(function (a, b) { return num(b.balance) - num(a.balance); });
    SRC.bal = sorted;

    var total = 0, i;
    for (i = 0; i < users.length; i++) total += num(users[i].balance);

    $('tBal').textContent = total.toLocaleString() + ' ETB';
    $('tCount').textContent = users.length + ' registered';

    if (!sorted.length) {
      $('bList').innerHTML = '<li class="empty">No data available.</li>';
      return;
    }
    var html = '';
    for (i = 0; i < sorted.length; i++) {
      var b = num(sorted[i].balance);
      html += rowHtml(sorted[i], b.toLocaleString() + ' ETB', b === 0 ? 'z' : 'g', i, 'bal');
    }
    $('bList').innerHTML = html;
  }

  /* ---------- details ---------- */
  function showDetails(p) {
    var h = handle(p);
    var c = colorFor(h);
    var av = $('d-av');

    av.textContent = initialOf(h);
    av.style.background = c[0];
    av.style.color = c[1];

    $('d-name').textContent = p.username || 'Anonymous User';
    $('d-handle').textContent = h;
    $('d-id').textContent = p.telegramId || 'N/A';
    $('d-user').textContent = p.telegram_handle || p.username || 'N/A';
    $('d-stake').textContent = (p.stake || 0) + ' ETB';

    var card = cardOf(p);
    $('d-card').textContent = (card === 'N/A') ? 'N/A' : '#' + card;
    $('d-bal').textContent = num(p.balance).toLocaleString() + ' ETB';

    show('details');
  }

  /* ---------- events ---------- */
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    stake = parseInt(b.dataset.stake, 10);

    var kids = this.children, i;
    for (i = 0; i < kids.length; i++) kids[i].classList.toggle('on', kids[i] === b);

    $('room').textContent = stake + ' ETB Room';
    renderLive();
    socket.emit('admin:requestPlayers');
  });

  $('nav').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var v = b.dataset.view;
    show(v);
    if (v === 'users' || v === 'bal') socket.emit('admin:getAllRegisteredPlayers');
  });

  document.addEventListener('click', function (e) {
    var li = e.target.closest('.row');
    if (!li) return;
    var arr = SRC[li.dataset.src] || [];
    var p = arr[parseInt(li.dataset.i, 10)];
    if (p) showDetails(p);
  });

  $('back').addEventListener('click', function () { show(lastMain); });

  /* ---------- socket ---------- */
  var socket = io('/admin', {
    query: { secret: secret },
    transports: ['websocket', 'polling']   // try WS first = faster connect
  });

  socket.on('connect', function () {
    socket.emit('admin:getAllRegisteredPlayers');
    socket.emit('admin:requestPlayers');
  });

  socket.on('connect_error', function (err) {
    $('liveList').innerHTML =
      '<li class="empty" style="color:#f87171">Connection failed: ' + esc(err.message) + '</li>';
  });

  socket.on('admin:playersList', function (data) {
    if (Array.isArray(data)) {
      live = data;
      status = {};
    } else {
      live = data.players || [];
      status = data.gameStatus || {};
    }
    renderLive();
  });

  socket.on('admin:allRegisteredPlayers', function (data) {
    users = Array.isArray(data) ? data : (data.users || []);
    renderUsers();
    renderBal();
  });
})();
</script>
</body>
</html>
