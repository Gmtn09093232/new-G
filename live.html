<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Telegram Bingo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-app: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --border-color: #f1f5f9;
            --primary-blue: #4f46e5;
            --primary-blue-bg: #e0e7ff;
            --green-badge-bg: #dcfce7;
            --green-badge-text: #16a34a;
            --blue-badge-bg: #e0f2fe;
            --blue-badge-text: #0284c7;
            --gray-tab-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-body);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 0;
        }

        /* Simulate Mobile Phone Screen */
        .app-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-app);
            border-radius: 32px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 800px;
            position: relative;
        }

        /* --- Header --- */
        .app-header {
            padding: 24px 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-titles h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: var(--text-main);
        }

        .header-titles p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 16px;
            color: var(--text-muted);
        }

        .header-actions svg {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        /* --- Tabs --- */
        .stake-tabs {
            display: flex;
            background: var(--gray-tab-bg);
            margin: 0 20px 20px;
            padding: 4px;
            border-radius: 16px;
        }

        .stake-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .stake-tab.active {
            background: var(--primary-blue-bg);
            color: var(--primary-blue);
        }

        /* --- Main Content Area --- */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px;
            padding-bottom: 90px; /* Space for bottom nav */
        }

        /* --- Room Header --- */
        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        .room-title-group h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--green-badge-bg);
            color: var(--green-badge-text);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green-badge-text);
        }

        .player-count {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .player-count svg {
            width: 16px;
            height: 16px;
        }

        /* --- Player List --- */
        .player-list {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .player-item {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
            gap: 14px;
        }

        .player-item:last-child {
            border-bottom: none;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .player-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .player-handle {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .player-id {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .player-action {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-badge {
            background: var(--blue-badge-bg);
            color: var(--blue-badge-text);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .chevron {
            color: var(--text-light);
            width: 18px;
            height: 18px;
        }

        /* --- Empty State --- */
        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--text-light);
            font-size: 0.85rem;
        }

        /* --- Admin Sections (Players & Balances Tabs) --- */
        .admin-section {
            display: none;
            padding-top: 10px;
        }
        
        .admin-section.active {
            display: block;
        }

        .total-balance-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: center;
        }

        .total-balance-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .total-balance-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-blue);
        }

        /* --- Bottom Navigation --- */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-app);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 24px;
            border-radius: 0 0 32px 32px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 20px;
            border-radius: 16px;
            transition: all 0.2s ease;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            stroke-width: 2;
        }

        .nav-item.active {
            background: var(--primary-blue-bg);
            color: var(--primary-blue);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-titles">
                <h1>Telegram Bingo</h1>
                <p>Play. Win. Together.</p>
            </div>
            <div class="header-actions">
                <!-- Bell Icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <!-- Menu Icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="1"></circle>
                    <circle cx="12" cy="5" r="1"></circle>
                    <circle cx="12" cy="19" r="1"></circle>
                </svg>
            </div>
        </header>

        <!-- Top Tabs (Stakes) -->
        <div class="stake-tabs">
            <div class="stake-tab active" data-stake="10">10 ETB</div>
            <div class="stake-tab" data-stake="20">20 ETB</div>
            <div class="stake-tab" data-stake="30">30 ETB</div>
        </div>

        <!-- Main Content -->
        <main class="content-area">
            
            <!-- LIVE VIEW (Matches Photo) -->
            <div id="live-view">
                <div class="room-header">
                    <div class="room-title-group">
                        <h2 id="roomTitle">10 ETB Room</h2>
                        <span class="status-badge" id="roomStatus">
                            <span class="status-dot"></span> Running
                        </span>
                    </div>
                    <div class="player-count">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span id="roomPlayerCount">0 players</span>
                    </div>
                </div>

                <ul class="player-list" id="livePlayerList">
                    <!-- Players populated here via JS -->
                </ul>
            </div>

            <!-- PLAYERS VIEW (Admin Registered Users) -->
            <div id="players-view" class="admin-section">
                <div class="room-header">
                    <div class="room-title-group">
                        <h2>Registered Users</h2>
                    </div>
                    <div class="player-count">
                        <span id="registeredCount">0</span> users
                    </div>
                </div>
                <ul class="player-list" id="registeredPlayerList">
                    <!-- Registered users populated here via JS -->
                </ul>
            </div>

            <!-- BALANCES VIEW (Admin Total Balance) -->
            <div id="balances-view" class="admin-section">
                <div class="total-balance-card">
                    <div class="total-balance-label">Total Balance (All users)</div>
                    <div class="total-balance-value" id="totalBalanceSum">0</div>
                </div>
                <ul class="player-list" id="balancePlayerList">
                    <!-- Balance list populated here via JS -->
                </ul>
            </div>

        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-target="live-view">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Live</span>
            </div>
            <div class="nav-item" data-target="players-view">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Players</span>
            </div>
            <div class="nav-item" data-target="balances-view">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                <span>Balances</span>
            </div>
        </nav>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- UI Logic ---
        const urlParams = new URLSearchParams(window.location.search);
        const adminSecret = urlParams.get('secret');
        
        if (!adminSecret) {
            document.getElementById('app').innerHTML =
                '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#e74c3c;font-family:Inter,sans-serif;padding:20px;text-align:center;"><div><strong>❌ Access denied</strong><br><span style="font-size:0.9rem;color:#94a3b8;">Missing secret.<br>Use: /live?secret=YOUR_SECRET</span></div></div>';
            throw new Error('No secret');
        }

        // Tab switching (Stakes)
        let activeStake = 10;
        const stakeTabs = document.querySelectorAll('.stake-tab');
        stakeTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                stakeTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                activeStake = parseInt(tab.dataset.stake);
                document.getElementById('roomTitle').innerText = `${activeStake} ETB Room`;
                socket.emit('admin:requestPlayers');
            });
        });

        // Bottom Nav switching
        const navItems = document.querySelectorAll('.nav-item');
        const sections = document.querySelectorAll('.content-area > div');
        
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                
                sections.forEach(s => s.classList.add('hidden'));
                const targetId = item.dataset.target;
                document.getElementById(targetId).classList.remove('hidden');
                
                if (targetId === 'players-view') socket.emit('admin:getAllRegisteredPlayers');
            });
        });

        // --- Socket Logic ---
        const socket = io('/admin', { query: { secret: adminSecret } });

        socket.on('connect', () => {
            console.log('✅ Admin connected');
            socket.emit('admin:getAllRegisteredPlayers');
            socket.emit('admin:requestPlayers');
        });

        socket.on('connect_error', (err) => {
            console.error('❌ Socket error:', err.message);
            document.getElementById('livePlayerList').innerHTML = '<div class="empty-state" style="color:#e74c3c;">⚠️ WebSocket failed. Check server & secret.</div>';
        });

        socket.on('admin:playersList', (data) => {
            updateLiveView(activeStake, data.players, data.gameStatus);
        });

        socket.on('admin:allRegisteredPlayers', (data) => {
            updateRegisteredView(data.users);
            updateBalancesView(data.users);
        });

        // --- Rendering Logic ---
        
        // Utility to generate avatar colors based on username string
        const avatarColors = [
            { bg: '#e0f2fe', text: '#0284c7' }, // Light Blue
            { bg: '#ccfbf1', text: '#0d9488' }, // Teal
            { bg: '#ffedd5', text: '#ea580c' }, // Orange
            { bg: '#f3e8ff', text: '#9333ea' }, // Purple
            { bg: '#fef08a', text: '#ca8a04' }, // Yellow
            { bg: '#fce7f3', text: '#db2777' }  // Pink
        ];

        function getAvatarStyle(str) {
            if (!str) return avatarColors[0];
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return avatarColors[Math.abs(hash) % avatarColors.length];
        }

        function createPlayerListItem(handle, id, badgeText, badgeClass = 'card-badge') {
            const initial = handle ? handle.charAt(0).toUpperCase() : '?';
            const color = getAvatarStyle(handle);
            
            return `
                <li class="player-item">
                    <div class="avatar" style="background: ${color.bg}; color: ${color.text};">${initial}</div>
                    <div class="player-info">
                        <span class="player-handle">@${handle}</span>
                        <span class="player-id">${id}</span>
                    </div>
                    <div class="player-action">
                        <span class="${badgeClass}">${badgeText}</span>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                </li>
            `;
        }

        function updateLiveView(stake, allPlayers, gameStatus) {
            const stakePlayers = (allPlayers || []).filter(p => p.stake === stake);
            const tbody = document.getElementById('livePlayerList');
            const countEl = document.getElementById('roomPlayerCount');
            const statusEl = document.getElementById('roomStatus');
            
            countEl.innerText = `${stakePlayers.length} players`;
            
            if (gameStatus && gameStatus[stake]) {
                statusEl.innerHTML = `<span class="status-dot"></span> ${gameStatus[stake].toUpperCase()}`;
                if (gameStatus[stake].toLowerCase() === 'ended') {
                    statusEl.style.background = '#f1f5f9';
                    statusEl.style.color = '#64748b';
                    statusEl.querySelector('.status-dot').style.background = '#64748b';
                }
            }

            if (!stakePlayers.length) {
                tbody.innerHTML = `<div class="empty-state">👻 No players in ${stake} ETB stake</div>`;
                return;
            }

            let html = '';
            stakePlayers.forEach(p => {
                const handle = escapeHtml(p.telegram_handle || 'unknown');
                const telegramId = escapeHtml(p.telegramId);
                const cardNum = p.cardNumber;
                html += createPlayerListItem(handle, telegramId, `#${cardNum}`);
            });
            tbody.innerHTML = html;
        }

        function updateRegisteredView(users) {
            const tbody = document.getElementById('registeredPlayerList');
            document.getElementById('registeredCount').innerText = users ? users.length : 0;

            if (!users || users.length === 0) {
                tbody.innerHTML = '<div class="empty-state">📭 No registered users found.</div>';
                return;
            }

            const sorted = [...users].sort((a, b) => (b.balance || 0) - (a.balance || 0));
            let html = '';
            sorted.forEach(user => {
                const handle = escapeHtml(user.telegram_handle || 'unknown');
                const telegramId = escapeHtml(user.telegramId);
                const balance = user.balance ?? 0;
                const formattedBalance = balance.toLocaleString();
                
                // Using card-badge style for balance here
                let badgeStyle = 'card-badge';
                if (balance < 0) badgeStyle += ' style="background:#fee2e2; color:#dc2626;"';
                
                html += createPlayerListItem(handle, telegramId, formattedBalance, badgeStyle);
            });
            tbody.innerHTML = html;
        }

        function updateBalancesView(users) {
            const tbody = document.getElementById('balancePlayerList');
            let totalBalance = 0;
            if (users && users.length > 0) {
                totalBalance = users.reduce((sum, user) => sum + (user.balance || 0), 0);
            }
            document.getElementById('totalBalanceSum').innerText = totalBalance.toLocaleString();

            if (!users || users.length === 0) {
                tbody.innerHTML = '<div class="empty-state">No data available.</div>';
                return;
            }

            const sorted = [...users].sort((a, b) => (b.balance || 0) - (a.balance || 0));
            let html = '';
            sorted.forEach(user => {
                const handle = escapeHtml(user.telegram_handle || 'unknown');
                const balance = user.balance ?? 0;
                const formattedBalance = balance.toLocaleString();
                
                let colorStyle = 'color: #64748b;'; // zero
                if (balance > 0) colorStyle = 'color: #16a34a;';
                else if (balance < 0) colorStyle = 'color: #dc2626;';
                
                html += `
                    <li class="player-item">
                        <div class="player-info" style="flex-direction: row; justify-content: space-between; align-items: center;">
                            <span class="player-handle" style="font-weight: 500;">@${handle}</span>
                            <span style="font-weight: 700; font-size: 0.9rem; ${colorStyle}">${formattedBalance} ETB</span>
                        </div>
                    </li>
                `;
            });
            tbody.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
        }
    </script>
</body>
</html>
