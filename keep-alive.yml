name: Keep Render Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute sleep timer
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -sS --max-time 30 "https://YOUR-SERVICE-NAME.onrender.com" > /dev/null
          echo "Ping successful at $(date)"
